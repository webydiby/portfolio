  <style>
    * {
      padding: 0;

      box-sizing: border-box;

    body {
      overflow: hidden;
      color: hsl(0, 0%, 20%);;
      font-size: 16px;
    }
    </style>
  <style>
    #splash {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100vh;
      background: crimson;
      animation: fade-out var(--fade) var(--totalDelay) ease forwards;
      
      &, * {
        --drop: 750ms;
        --delay: 1000ms;
        --flip: 500ms;
        --fade: 500ms;
        --totalDelay: calc(var(--drop) * 0.5 + (var(--delay) + var(--flip)) * var(--step, 3));
        --gutter: 1.5em;
      }

      .card,
      .card-shadow {
        z-index: calc(100 - var(--page));
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -75%);
        display: grid;
        width: calc(100% - var(--gutter) * 2);
        max-width: calc(481px - var(--gutter) * 2);
        aspect-ratio: 2 / 1;
        place-items: center;
        animation: drop var(--drop) ease forwards, var(--animation, none); 
        
        &.card:not(:last-child) {
          --step: var(--page);
          --animation: fade-out var(--flip) var(--totalDelay) ease forwards;
          background: hsl(35, 75%, 90%);
        }
        
        img {
          height: 10%;
          
          .card:last-child & {
            height: 15%;
          }
        }
        
        &.card-shadow {
          --animation: fade-in var(--drop) forwards ease, fade-out var(--fade) var(--totalDelay) ease forwards;
          top: 51.25%;
          transform: translate(-50%, -25%);
          background: hsla(0, 0%, 0%, 25%);
          opacity: 0.125;
          box-shadow: 0 0 5px hsla(0, 0%, 0%, 25%);  
          filter: blur(5px);
        }
      }

      .progress-bar {
        position: absolute;
        left: 50%;
        top: 75%;
        transform: translate(-50%, -50%);
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        width: 50%;
        max-width: calc((481px - var(--gutter) * 2) * 0.5);
        aspect-ratio: 15 / 1;
        gap: 2.5%;
        align-items: center;
        animation: fade-out var(--fade) var(--totalDelay) ease forwards;

        img {
          width: 100%;
        }

        div {
          --step: var(--index);
          aspect-ratio: 10 / 1;
          background: #fff;
          opacity: 0.5;
          filter: opacity(0.8);
          animation: fade-in var(--flip) var(--totalDelay) ease forwards;
        }
      }
    }
    
    @keyframes drop {
      to {
        transform: translate(-50%, -50%);
      }
    }
    
    @keyframes fade-in {
      to {
        opacity: 1;
      }
    }

    @keyframes fade-out {
      to {
        visibility: hidden;
        opacity: 0;
      }
    }

    @keyframes scroll {
      to {
        transform: translateY(-100vh);
      }
    }
  </style>
  <style>
    #portfolio {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
      background: #eee;
      
      nav {
        width: 100%;
        padding: 1em;
        background: #fff;
        box-shadow: 0 0 4px hsla(0, 0%, 0%, 5%);
      }
      
      .container {
        --col: 3;
        display: grid;
        grid-template-columns: repeat(var(--col), 1fr);
        width: 100%;
        max-width: 1280px;
        padding: 2em 1em;
        margin: auto;
        gap: 1em;

        @media (max-width: 768px) {
          --col: 2;
        }
        
        @media (max-width: 480px) {
          --col: 1;
        }

        .item {
          display: flex;
          flex-wrap: wrap;
          min-width: 0;
          padding: 1em;
          align-content: space-between;
          gap: 1em 0.5em;
          border-radius: 0.5em;
          background: #fff;
          box-shadow: 0 0 4px hsla(0, 0%, 0%, 5%);
          line-height: 1;

          .title {
            flex-basis: 100%;
            padding: 0.125em 0;
          }
          
          img {
            min-width: 0;
            flex-basis: 100%;
            border-radius: 0.25em;
            background: #aaa;
          }
          
          .tag {
            display: inline-block;
            padding: 0.5em 0.75em;
            border-radius: 0.25em;
            background: #efefef;
            font-size: 0.75em;
          }
          
          .btn-area {
            display: flex;
            flex-basis: 100%;
            gap: inherit;
            
            a {
              display: block;
              flex-grow: 1;
              padding: 0.75em;
              border-radius: 0.25em;
              background: hsl(0, 0%, 90%);
              border: 1px solid hsla(0, 0%, 0%, 5%);
              text-align: center;
              text-decoration: none;
              transition: background 100ms ease-out, color 100ms ease-out;

              &:hover,
              &:active {
                background: hsl(0, 0%, 40%);
                color: #fff;
              }
            }
          }
        }
      }
    }
  </style>
</head>
